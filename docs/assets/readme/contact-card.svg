    <text x="92" y="242" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="800">微</text>
    <text x="82" y="288" fill="#111111" font-size="17" font-weight="700">微信</text>
    <text x="82" y="321" fill="#444444" font-size="15">FH01xy</text>
    <text x="82" y="344" fill="#666666" font-size="12">下方代码框一键复制</text>

    <rect x="274" y="198" width="202" height="166" rx="18" fill="#1d1d1d" stroke="#555555"/>
    <circle cx="312" cy="236" r="20" fill="#ffffff"/>
    <text x="312" y="242" text-anchor="middle" fill="#111111" font-size="18" font-weight="800">即</text>
    <text x="302" y="288" fill="#ffffff" font-size="17" font-weight="700">即刻</text>
    <text x="302" y="321" fill="#bbbbbb" font-size="15">泛函技术招聘</text>
    <text x="302" y="344" fill="#888888" font-size="12">点击下方链接访问</text>

    <rect x="494" y="198" width="202" height="166" rx="18" fill="#1d1d1d" stroke="#555555"/>
    <circle cx="532" cy="236" r="20" fill="#ffffff"/>
    <text x="532" y="242" text-anchor="middle" fill="#111111" font-size="18" font-weight="800">红</text>
    <text x="522" y="288" fill="#ffffff" font-size="17" font-weight="700">小红书</text>
    <text x="522" y="321" fill="#bbbbbb" font-size="15">@泛函</text>
    <text x="522" y="344" fill="#888888" font-size="12">点击下方链接访问</text>

    <rect x="714" y="198" width="202" height="166" rx="18" fill="#1d1d1d" stroke="#555555"/>
    <circle cx="752" cy="236" r="20" fill="#ffffff"/>
    <text x="752" y="242" text-anchor="middle" fill="#111111" font-size="18" font-weight="800">视</text>
    <text x="742" y="288" fill="#ffffff" font-size="17" font-weight="700">视频号</text>
    <text x="742" y="321" fill="#bbbbbb" font-size="15">泛函</text>
    <text x="742" y="344" fill="#888888" font-size="12">下方代码框一键复制</text>

    <rect x="934" y="198" width="212" height="166" rx="18" fill="#1d1d1d" stroke="#555555"/>
    <circle cx="972" cy="236" r="20" fill="#ffffff"/>
    <text x="972" y="242" text-anchor="middle" fill="#111111" font-size="18" font-weight="800">公</text>
    <text x="962" y="288" fill="#ffffff" font-size="17" font-weight="700">公众号</text>
    <text x="962" y="321" fill="#bbbbbb" font-size="15">泛函</text>
    <text x="962" y="344" fill="#888888" font-size="12">下方代码框一键复制</text>
