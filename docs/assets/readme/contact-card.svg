<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">泛函招聘团队联系方式</title>
  <desc id="desc">泛函在微信、即刻、小红书、视频号和公众号的联系入口。</desc>
  <rect width="1200" height="430" rx="24" fill="#111111"/>
